<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamed Dashboard</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#0b1020;color:#fff}
.dashboard{width:100%;height:100vh;display:flex;overflow:hidden}
.sidebar{width:240px;background:#080d18;border-left:1px solid #202a40;padding:20px}
.logo{font-size:20px;font-weight:bold;margin-bottom:28px}
.nav{display:grid;gap:8px}.nav button{width:100%;padding:12px;border:0;border-radius:8px;background:transparent;color:#9aa8c0;text-align:right;cursor:pointer}.nav button:hover,.nav button.active{background:#151f35;color:#fff}
.content{flex:1;padding:24px;overflow:auto}.header{height:58px;border-bottom:1px solid #202a40;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.box{min-height:140px;border:1px solid #202a40;border-radius:12px;background:#0f1728}
.wide{grid-column:span 8}.small{grid-column:span 4}.full{grid-column:1/-1}
@media(max-width:800px){.dashboard{display:block;overflow:auto}.sidebar{width:100%;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.content{height:auto}.wide,.small{grid-column:1/-1}}
</style>
</head>
<body>
<div class="dashboard">
<aside class="sidebar">
<div class="logo">HAMED</div>
<nav class="nav">
<button class="active">داشبورد</button>
<button>بخش ۱</button>
<button>بخش ۲</button>
<button>بخش ۳</button>
<button>تنظیمات</button>
</nav>
</aside>
<main class="content">
<div class="header"></div>
<div class="grid">
<div class="box wide"></div>
<div class="box small"></div>
<div class="box small"></div>
<div class="box wide"></div>
<div class="box full"></div>
</div>
</main>
</div>
</body>
</html>
