<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d16">
<title>Hamed Dashboard</title>
<style>
:root{--bg:#090d16;--sidebar:#070b12;--panel:#0d1420;--line:#1d293b;--text:#eef3fb;--muted:#7f8da3;--accent:#4d8dff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif}
button{font:inherit}.app{min-height:100vh;display:flex}.sidebar{width:250px;flex:0 0 250px;background:var(--sidebar);border-left:1px solid var(--line);padding:22px 16px}
.brand{height:54px;display:flex;align-items:center;gap:11px;padding:0 8px 18px;border-bottom:1px solid var(--line)}.logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#121d2e;border:1px solid #263750;font-weight:800}
.brand-title{font-weight:700;letter-spacing:.3px}.brand-sub{font-size:11px;color:var(--muted);margin-top:3px}.nav{display:grid;gap:7px;margin-top:20px}
.nav button{width:100%;border:1px solid transparent;background:transparent;color:#9aa8bd;padding:12px 13px;border-radius:10px;text-align:right;cursor:pointer}.nav button:hover{background:#101a2a;color:#dce7f8}.nav button.active{background:#15233a;border-color:#253a5a;color:#fff}
.main{flex:1;min-width:0;padding:24px}.topbar{min-height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:20px}
.page-title{font-size:20px;font-weight:700}.page-sub{font-size:12px;color:var(--muted);margin-top:4px}.status{width:9px;height:9px;border-radius:50%;background:#263348;border:1px solid #34435b}
.canvas{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.widget{min-height:150px;background:var(--panel);border:1px solid var(--line);border-radius:14px;position:relative}
.widget:before{content:"";position:absolute;inset:12px;border:1px dashed #172235;border-radius:9px;pointer-events:none}
.w8{grid-column:span 8}.w4{grid-column:span 4}.w6{grid-column:span 6}.w12{grid-column:1/-1}
.clock{min-height:150px;display:flex;align-items:center;justify-content:center}.clock-inner{text-align:center;position:relative;z-index:1}.clock-label{font-size:12px;color:var(--muted);margin-bottom:8px}.clock-time{font-size:42px;font-weight:700;letter-spacing:1px;direction:ltr;font-variant-numeric:tabular-nums}.clock-date{font-size:13px;color:#aab7c9;margin-top:8px}.footer{padding:22px 2px 4px;color:#4f5d72;font-size:11px;text-align:center}
@media(max-width:900px){.app{display:block}.sidebar{width:100%;border-left:0;border-bottom:1px solid var(--line);padding:14px}.brand{border-bottom:0;padding-bottom:8px}.nav{display:flex;overflow-x:auto;margin-top:8px}.nav button{white-space:nowrap;width:auto;flex:0 0 auto}.main{padding:16px}.w8,.w4,.w6{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">H</div><div><div class="brand-title">HAMED</div><div class="brand-sub">Personal Dashboard</div></div></div>
<nav class="nav" id="nav"><button class="active" data-page="dashboard">داشبورد</button><button data-page="section1">بخش ۱</button><button data-page="section2">بخش ۲</button><button data-page="section3">بخش ۳</button><button data-page="settings">تنظیمات</button></nav></aside>
<main class="main">
<header class="topbar"><div><div class="page-title" id="title">داشبورد</div><div class="page-sub" id="sub">فضای خالی آماده توسعه</div></div><div class="status" title="Live"></div></header>
<section class="canvas" id="canvas">
<div class="widget w8"></div>
<div class="widget w4 clock"><div class="clock-inner"><div class="clock-label">🇬🇧 لندن — ساعت زنده</div><div class="clock-time" id="clockTime">--:--:--</div><div class="clock-date" id="clockDate">---</div></div></div>
<div class="widget w4"></div><div class="widget w8"></div><div class="widget w6"></div><div class="widget w6"></div><div class="widget w12"></div>
</section>
<div class="footer">HAMED DASHBOARD • LONDON CLOCK</div>
</main></div>
<script>
const pages={dashboard:['داشبورد','فضای خالی آماده توسعه'],section1:['بخش ۱','فضای خالی'],section2:['بخش ۲','فضای خالی'],section3:['بخش ۳','فضای خالی'],settings:['تنظیمات','فضای خالی']};
const nav=document.querySelectorAll('#nav button'),title=document.getElementById('title'),sub=document.getElementById('sub');
nav.forEach(btn=>btn.addEventListener('click',()=>{nav.forEach(x=>x.classList.remove('active'));btn.classList.add('active');const p=pages[btn.dataset.page];title.textContent=p[0];sub.textContent=p[1]}));
const days=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const months=['ژانویه','فوریه','مارس','آوریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'];
function updateLondonClock(){
 const now=new Date();
 const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,day:'2-digit',month:'2-digit',year:'numeric',weekday:'long'}).formatToParts(now);
 const get=t=>parts.find(x=>x.type===t)?.value||'';
 const d=new Date(Date.UTC(+get('year'),+get('month')-1,+get('day')));
 const dayIndex=d.getUTCDay();
 document.getElementById('clockTime').textContent=get('hour')+':'+get('minute')+':'+get('second');
 document.getElementById('clockDate').textContent=days[dayIndex]+'، '+get('day')+' '+months[+get('month')-1]+' '+get('year');
}
updateLondonClock();setInterval(updateLondonClock,1000);
</script>
</body></html>
